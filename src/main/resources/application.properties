spring.application.name=store

# Database Connection Details
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties..hibernate.format_sql=true

# Flyway

spring.flyway.enabled=true

# JWT Config
# 256-bit Hex secret key
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# Redis Config
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Force Spring to use the standard Redis CacheManager instead of Redisson JCache
spring.cache.type=redis

# MongoDB Config
spring.mongodb.uri=mongodb://localhost:27017/ecommerce_db

# Kafka Config
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ecommerce-notification-group

# Standard Error Responses
spring.mvc.problemdetails.enabled=false